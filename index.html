<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>任务清单</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">任务清单</h1>
      <p class="app__subtitle" id="summary-line">还没有任务，先添加一条吧</p>
    </header>

    <form class="composer" id="composer" novalidate>
      <label class="visually-hidden" for="task-input">新任务内容</label>
      <input
        class="composer__input"
        id="task-input"
        type="text"
        placeholder="需要做什么？"
        autocomplete="off"
        maxlength="200"
        aria-describedby="composer-error"
      >
      <button class="composer__submit" id="add-btn" type="submit">添加</button>
    </form>
    <p class="composer__error" id="composer-error" role="alert" hidden></p>

    <section class="toolbar" aria-label="筛选">
      <div class="filters" role="group" aria-label="按状态筛选任务">
        <button class="filters__btn is-active" type="button" data-filter="all" aria-pressed="true">
          全部 <span class="filters__count" data-count="all">0</span>
        </button>
        <button class="filters__btn" type="button" data-filter="active" aria-pressed="false">
          未完成 <span class="filters__count" data-count="active">0</span>
        </button>
        <button class="filters__btn" type="button" data-filter="completed" aria-pressed="false">
          已完成 <span class="filters__count" data-count="completed">0</span>
        </button>
      </div>
      <button class="toolbar__clear" id="clear-completed" type="button" hidden>清除已完成</button>
    </section>

    <ul class="task-list" id="task-list" aria-label="任务列表"></ul>

    <p class="empty-state" id="empty-state" hidden></p>
  </main>

  <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>

  <dialog class="confirm" id="clear-confirm" aria-labelledby="clear-confirm-title">
    <form method="dialog" class="confirm__form">
      <h2 class="confirm__title" id="clear-confirm-title">清除已完成任务？</h2>
      <p class="confirm__text" id="clear-confirm-text"></p>
      <div class="confirm__actions">
        <button class="confirm__btn" type="submit" value="cancel" id="clear-confirm-cancel">取消</button>
        <button class="confirm__btn confirm__btn--danger" type="submit" value="confirm" id="clear-confirm-ok">清除</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
